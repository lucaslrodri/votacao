<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultado da votação do novo logo do PEI</title>
<meta name="description" content="Resultado da votação do novo logo do PEI: 14 votos e 528 marcações nas 12 finalistas. Grupo de Pesquisa em Aplicações Industriais, Engenharia Elétrica, Ufac.">
<!-- o banner social (WhatsApp, redes): as imagens são as da votação (banner-social-quadrado.typ e banner-social.typ) -->

<meta property="og:site_name" content="PEI · Ufac">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Resultado da votação do novo logo do PEI">
<meta property="og:description" content="Votação encerrada: 14 votos e 528 marcações nas 12 finalistas.">
<meta property="og:url" content="https://lucaslrodri.github.io/votacao/?v=4">
<meta property="og:image" content="https://lucaslrodri.github.io/votacao/social-quadrado.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta property="og:image:alt" content="Novo logo do PEI, com os ícones das 12 finalistas">
<meta property="og:image" content="https://lucaslrodri.github.io/votacao/social.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Novo logo do PEI, com os ícones das 12 finalistas">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lucaslrodri.github.io/votacao/social.png">
<link rel="icon" href="img/12A/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #083671; --ufac: #0C4DA2; --ouro: #FFBF14; --grafite: #1E1E1E; --nevoa: #DBE4F1;
    --cinza: #5B6678; --linha: #DADFE7; --fundo: #EEF2F8; --apagado: #B4C3DA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, system-ui, sans-serif; color: var(--grafite); background: var(--fundo); }
  .faixa { display: grid; grid-template-columns: 60% 30% 10%; height: 6px; }
  .faixa i:nth-child(1) { background: var(--azul); } .faixa i:nth-child(2) { background: var(--ufac); }
  .faixa i:nth-child(3) { background: var(--ouro); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  .cartao { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 24px 22px 20px; }
  .chapeu { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--ufac); }
  h1 { margin: 8px 0 6px; font-size: clamp(22px, 5vw, 30px); font-weight: 800; color: var(--azul); line-height: 1.15; }
  .sub { margin: 0 0 22px; font-size: 14px; color: var(--cinza); line-height: 1.45; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 48px minmax(0, 11rem) 1fr; column-gap: 12px; align-items: center;
       min-height: 60px; }
  .ic { width: 48px; height: 48px; border: 1px solid #E1E5EC; border-radius: 10px; background: #fff;
        display: grid; place-items: center; }
  .ic img { width: 76%; height: 76%; object-fit: contain; }
  .nome { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .nome small { display: block; font-size: 12px; font-weight: 400; color: var(--cinza); margin-top: 2px; }
  .trilho { align-self: stretch; display: flex; align-items: center; gap: 6px; border-left: 1px solid var(--apagado); }
  .barra { height: 18px; background: var(--azul); border-radius: 0 4px 4px 0; min-width: 2px; }
  .valor { font-size: 14px; font-weight: 700; }
  .nota { margin: 18px 0 0; font-size: 12px; color: var(--cinza); line-height: 1.45; }
  .acoes { margin-top: 16px; font-size: 14px; }
  .acoes a { color: var(--ufac); font-weight: 600; }
  /* no celular, o nome fica em cima da barra, para a barra ter a largura toda */
  @media (max-width: 560px) {
    .cartao { padding: 20px 14px 16px; }
    li { grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 4px;
         min-height: 0; padding: 7px 0; }
    .ic { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 9px; }
    .nome { font-size: 13px; }
    .nome small { display: inline; margin: 0 0 0 6px; }
    .trilho { border-left: 0; }
    .barra { height: 14px; }
  }
</style>
</head>
<body>
<div class="faixa" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section class="cartao">
    <p class="chapeu">VOTAÇÃO ENCERRADA</p>
    <h1>Resultado da votação do novo logo do PEI</h1>
    <p class="sub" id="sub"></p>
    <ol id="lista" aria-label="Total de marcações por finalista"></ol>
    <p class="nota">Em cada etapa, a pessoa podia marcar mais de uma finalista; a barra soma todas as marcações das 20
      etapas. Obrigado a todos que votaram!</p>
    <p class="acoes"><a href="resultado.png" download="resultado-votacao-logo-pei.png">Baixar o gráfico (imagem)</a></p>
  </section>
</main>
<script>
  // O resultado final, de ../apuracao.json (o mesmo do grafico-votacao.typ): código, marcações e, se houver, o código
  // a mostrar no lugar do código real (a vencedora, 12A, aparece como 12J, e a 12J como 12A). Os nomes e as imagens
  // das finalistas vêm de selecao.js e de img/<código real>/.
  const RESULTADO = {
    encerrada: "23/11/2026, às 11h50",
    votos: 14,
    totais: [
      ["12A", 84, "12J"], ["8A", 80], ["12J", 62, "12A"], ["1A", 59], ["1H", 54],
      ["9B", 54], ["7B", 42], ["2C", 32], ["4A", 31], ["15F", 26], ["3E", 3], ["13B", 1],
    ],
  };
</script>
<script src="selecao.js"></script>
<script>
  (function () {
    const nomes = {};
    (window.SELECAO || []).forEach(function (s) { nomes[s.cod] = s.nome; });
    const total = RESULTADO.totais.reduce(function (s, t) { return s + t[1]; }, 0);
    const maximo = Math.max.apply(null, RESULTADO.totais.map(function (t) { return t[1]; }));
    document.getElementById("sub").textContent = RESULTADO.votos + " votos e " + total +
      " marcações, somadas as 20 etapas. Votação encerrada em " + RESULTADO.encerrada + ".";
    const lista = document.getElementById("lista");
    RESULTADO.totais.forEach(function (t) {
      const cod = t[0], n = t[1], rotulo = t[2] || cod, nome = nomes[cod] || cod;
      const li = document.createElement("li");
      li.innerHTML =
        '<span class="ic"><img alt="" src="img/' + cod + '/icone.svg"></span>' +
        '<span class="nome"></span>' +
        '<span class="trilho"><span class="barra"></span><span class="valor"></span></span>';
      li.querySelector(".nome").textContent = nome;
      const sm = document.createElement("small"); sm.textContent = rotulo; li.querySelector(".nome").appendChild(sm);
      li.querySelector(".barra").style.width = "calc((100% - 2.6em) * " + (n / maximo) + ")";
      li.querySelector(".valor").textContent = n;
      li.setAttribute("aria-label", nome + ": " + n + (n === 1 ? " marcação" : " marcações"));
      lista.appendChild(li);
    });
  })();
</script>
</body>
</html>
